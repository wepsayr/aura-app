<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Aura</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2196f3">
</head>
<body class="theme-blue">
    <div class="container">
        <h1>💎 Aura</h1>
        <p class="subtitle">Войди, чтобы продолжить свой путь</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="ai-tip" style="background: #ffcdd2; color: #b71c1c;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="profile-form">
            <label>Логин:
                <input type="text" name="username" required>
            </label>
            <label>Пароль:
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            Нет аккаунта? <a href="/register" style="color: var(--primary);">Зарегистрироваться</a>
        </p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    </script>
</body>
</html>

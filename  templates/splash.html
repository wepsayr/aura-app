<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2196f3">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 40%, #bbdefb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .splash-container {
            text-align: center;
            animation: fadeIn 1s ease;
        }
        .splash-logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .splash-message {
            font-size: 28px;
            color: #1565c0;
            font-weight: 600;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-logo">💎</div>
        <div class="splash-message" id="greeting">
            {% if user and user.name %}
                Привет, {{ user.name }}!
            {% else %}
                Привет!
            {% endif %}
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "{{ '/dashboard' if user else '/login' }}";
        }, 3000);
    </script>
</body>
</html>

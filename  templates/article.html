<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }} — Aura</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2196f3">
</head>
<body class="theme-{{ user.theme }}">
    <div class="container">
        <h1>{{ article.title }}</h1>
        <a href="/library" class="back-link">← Назад к библиотеке</a>
        <div class="article-content">
            {{ article.content }}
        </div>

        <nav class="bottom-nav">
            <a href="/dashboard" class="nav-btn" title="Главная">🏠</a>
            <a href="/habits" class="nav-btn" title="Упражнения">💪</a>
            {% if user.goal in ['habits', 'all'] %}
            <a href="/bad_habits" class="nav-btn" title="Вредные">❌</a>
            {% endif %}
            {% if user.goal in ['voice', 'all'] %}
            <a href="/voice" class="nav-btn" title="Голос">🎤</a>
            {% endif %}
            {% if user.goal in ['posture', 'all'] %}
            <a href="/posture" class="nav-btn" title="Осанка">🧍</a>
            {% endif %}
            {% if user.goal in ['appearance', 'all'] %}
            <a href="/style" class="nav-btn" title="Стиль">👔</a>
            {% endif %}
            <a href="/library" class="nav-btn" title="Библиотека">📚</a>
            <a href="/profile" class="nav-btn" title="Профиль">👤</a>
            <a href="/logout" class="nav-btn" title="Выйти" onclick="return confirm('Вы точно хотите выйти из аккаунта?');">🚪</a>
        </nav>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — Aura</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
</head>
<body class="theme-blue">
    <div class="container">
        <h1>💎 Aura</h1>
        <p class="subtitle">Восстановление пароля</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="ai-tip" style="background: {% if category == 'success' %}#c8e6c9{% else %}#ffcdd2{% endif %}; color: {% if category == 'success' %}#1b5e20{% else %}#b71c1c{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <p style="text-align:center; font-size:0.9em; color:gray;">
            Введи свой email, и мы отправим ссылку для сброса пароля.
        </p>

        <form method="POST" class="profile-form">
            <label>Email:
                <input type="email" name="email" required placeholder="example@mail.ru">
            </label>
            <button type="submit" class="btn-primary">Отправить ссылку</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="/login" style="color: var(--primary);">← Назад ко входу</a>
        </p>
    </div>
</body>
</html>

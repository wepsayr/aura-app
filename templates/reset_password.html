<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — Aura</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
</head>
<body class="theme-blue">
    <div class="container">
        <h1>💎 Aura</h1>
        <p class="subtitle">Новый пароль</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="ai-tip" style="background: #ffcdd2; color: #b71c1c;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <p style="text-align:center; font-size:0.9em; color:gray;">
            Придумай новый пароль для своего аккаунта.
        </p>

        <form method="POST" class="profile-form">
            <label>Новый пароль:
                <input type="password" name="new_password" required minlength="4" placeholder="Минимум 4 символа">
            </label>
            <button type="submit" class="btn-primary">Сохранить новый пароль</button>
        </form>
    </div>
</body>
</html>
